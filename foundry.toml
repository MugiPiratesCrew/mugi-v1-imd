[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
auto_detect_remappings = false
optimizer = true
optimizer_runs = 200
via_ir = true
solc_version = "0.8.26"
evm_version = "cancun"
bytecode_hash = "none"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "v4-core/=lib/v4-core/",
    "solmate/=lib/v4-core/lib/solmate/"
]
